[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "jiff", wrappers = [
    "retirement-cli"
  ], reason = "core uses jiff-core; only the CLI reads the clock" }
]

[[bans.features]]
crate = "proptest"
deny = ["std", "fork", "timeout", "handle-panics", "hardware-rng"]
reason = "these read the OS random source, PROPTEST_* variables, the clock or files; core's properties use a fixed seed and no failure file"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
